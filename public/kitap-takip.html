<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --paper: #EEF1F6; --paper-line: #D7DCE5; --ink: #28334A; --ink-soft: #667085;
    --ribbon: #28724F; --ribbon-dark: #1D5A3E; --gold: #C7791F; --gold-soft: #F3DCB8;
    --card: #FFFFFF; --green: #178A5A; --brand-navy: #28334A;
    color-scheme: light;
  }
  /* Koyu ekran — ana portaldaki aynı data-tema attribute'u kullanılıyor.
     Marka renkleri (ribbon/gold/green) aynı kalıyor, sadece yüzey/metin
     tonları koyu zemine göre değişiyor. */
  html[data-tema="koyu"] {
    --paper: #161c2b; --paper-line: #323b52; --ink: #e7e9ee; --ink-soft: #97a0b3;
    --card: #1e2536; --gold-soft: rgba(199,121,31,0.28);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: 'Manrope', sans-serif; }
  #app { max-width: 640px; margin: 0 auto; padding: 22px 22px 40px; }
  .kd-serif { font-family: 'Sora', sans-serif; }
  .kd-mono { font-family: 'JetBrains Mono', monospace; }

  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  h1.title { font-size: 28px; font-weight: 700; margin: 0; line-height: 1.1; }
  .subtitle { color: var(--ink-soft); font-size: 13.5px; margin-top: 3px; }
  .header-right { display: flex; gap: 8px; flex-wrap: wrap; }

  button { font-family: 'Manrope', sans-serif; cursor: pointer; border: none; }
  button:active { transform: scale(0.97); }
  button:focus-visible, .row:focus-visible { outline: 2px solid var(--ribbon); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-primary { background: var(--ribbon); color: #fff; border-radius: 8px; padding: 0 16px; height: 38px; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
  .btn-dark { background: var(--ink); color: var(--paper); border-radius: 8px; padding: 9px 14px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  .btn-green { background: var(--green); color: #fff; border-radius: 8px; padding: 9px 14px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  .btn-outline { background: transparent; color: var(--ink); border: 1px solid var(--paper-line); border-radius: 8px; padding: 9px 14px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  .btn-save { background: var(--ink); color: var(--paper); border-radius: 8px; padding: 0 14px; font-size: 13px; font-weight: 700; height: 38px; }
  .icon-btn { background: transparent; border: none; color: var(--ink-soft); padding: 4px; display: inline-flex; }
  .icon-btn:hover { color: var(--ribbon); }

  .add-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  input.kd-input, input[type="date"], input[type="number"], textarea.kd-input {
    font-family: 'Manrope', sans-serif; border: 1px solid var(--paper-line); background: var(--card);
    border-radius: 8px; padding: 9px 12px; font-size: 14px; color: var(--ink); height: 38px;
  }
  textarea.kd-input { height: auto; min-height: 110px; resize: vertical; line-height: 1.5; width: 100%; }
  .kd-input:focus { outline: 2px solid var(--gold); outline-offset: 0; }
  .flex1 { flex: 1; min-width: 160px; }

  .card { background: var(--card); border: 1px solid var(--paper-line); border-radius: 10px; box-shadow: 0 1px 2px rgba(28,35,51,0.04); }
  .row { cursor: pointer; transition: background 0.12s ease; }
  .row:hover { background: rgba(40,114,79,0.06); }

  .teacher-row, .student-row { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--gold-soft); display: flex; align-items: center; justify-content: center; color: var(--ribbon-dark); flex-shrink: 0; }
  .name-title { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 19px; }
  .name-sub { font-size: 12.5px; color: var(--ink-soft); }

  .book-card { margin-bottom: 10px; overflow: hidden; }
  .book-top { display: flex; align-items: center; padding: 13px 14px; gap: 12px; }
  .book-icon { width: 30px; height: 40px; border-radius: 2px 6px 6px 2px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: 2px 2px 0 rgba(0,0,0,0.08); }
  .book-info { flex: 1; cursor: pointer; min-width: 0; }
  .book-name { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 18px; }
  .book-pages { font-size: 12.5px; color: var(--ink-soft); }
  .progress-track { margin-top: 6px; height: 5px; background: var(--paper-line); border-radius: 3px; overflow: hidden; max-width: 220px; }
  .progress-fill { height: 100%; }
  .book-log-row { padding: 0 14px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .history-panel { border-top: 1px dashed var(--paper-line); padding: 10px 14px 14px; display: none; }
  .history-panel.open { display: block; }
  .history-label { font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.4px; }
  .history-item { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; margin-bottom: 6px; gap: 8px; }
  .history-item .d { color: var(--ink-soft); }

  .empty { text-align: center; padding: 40px 20px; color: var(--ink-soft); border: 1px dashed var(--paper-line); border-radius: 10px; }
  .empty svg { margin-bottom: 10px; }

  .stat-row { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .stat-card { flex: 1; min-width: 110px; background: var(--card); border: 1px solid var(--paper-line); border-radius: 10px; padding: 12px 14px; }
  .stat-icon { color: var(--ribbon); margin-bottom: 6px; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; }
  .stat-label { font-size: 11.5px; color: var(--ink-soft); }

  .day-item { background: var(--card); border: 1px solid var(--paper-line); border-radius: 10px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; }
  .day-item .who { font-weight: 700; font-size: 15px; }
  .day-item .book { font-size: 12.5px; color: var(--ink-soft); }
  .day-item .pages { text-align: right; font-size: 13.5px; }
  .finished-tag { color: var(--gold); font-size: 12px; font-weight: 700; margin-top: 2px; }

  .group-box { background: var(--card); border: 1px solid var(--paper-line); border-radius: 10px; padding: 14px; margin-bottom: 18px; }
  .group-box h3 { margin: 0 0 10px; font-family: 'Sora', sans-serif; font-size: 19px; }
  .group-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ribbon-dark); color: var(--paper); padding: 10px 18px; border-radius: 8px; font-size: 13px; display: none; z-index: 50; max-width: 90%; text-align: center; }
  .toast.show { display: block; }
  .toast.ok { background: var(--green); }

  #splash {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--brand-navy);
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.6s ease;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash img {
    width: min(58vw, 300px);
    opacity: 0;
    transform: scale(0.9);
    animation: splashIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes splashIn { to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    #splash img { animation: none; opacity: 1; transform: none; }
    #splash { transition: none; }
  }

  #print-area { display: none; }
  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area {
      display: block !important; position: absolute; left: 0; top: 0; width: 100%;
      padding: 28px 34px; font-family: 'Manrope', sans-serif; color: #1C2333; background: #fff;
    }
    @page { margin: 16mm; }
  }
  #print-area .pr-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #1C2333; padding-bottom: 10px; margin-bottom: 4px; }
  #print-area .pr-brand { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 20px; }
  #print-area .pr-title { font-size: 15px; font-weight: 700; margin-top: 2px; }
  #print-area .pr-meta { text-align: right; font-size: 12px; color: #555; line-height: 1.5; }
  #print-area .pr-summary { display: flex; gap: 24px; margin: 16px 0 18px; font-size: 13px; }
  #print-area .pr-summary b { font-family: 'JetBrains Mono', monospace; font-size: 15px; display: block; }
  #print-area table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
  #print-area th { text-align: left; background: #F0F1F4; border: 1px solid #C7CCD6; padding: 7px 9px; font-weight: 700; }
  #print-area td { border: 1px solid #C7CCD6; padding: 7px 9px; }
  #print-area .pr-empty { padding: 20px; text-align: center; color: #777; font-size: 13px; border: 1px dashed #ccc; }
  #print-area .pr-footer { margin-top: 26px; font-size: 10.5px; color: #888; border-top: 1px solid #ddd; padding-top: 8px; }

  .setup-box { background: var(--card); border: 1px solid var(--paper-line); border-radius: 12px; padding: 20px; line-height: 1.6; font-size: 14.5px; }
  .setup-box h2 { font-family: 'Sora', sans-serif; font-size: 24px; margin-top: 0; }

      sb.from("students").select("*"),
      sb.from("books").select("*"),
      sb.from("logs").select("*"),
      sb.from("book_library").select("*"),
      sb.from("publishers").select("*"),
    ]);

    if (s.error) throw s.error;
    if (b.error) throw b.error;
    if (l.error) throw l.error;
    if (lib.error) throw lib.error;

  const splash = document.getElementById("splash");

  const elapsed = Date.now() - SPLASH_START;
  const remaining = Math.max(0, SPLASH_MIN_MS - elapsed);
  setTimeout(() => {
    splash.classList.add("hide");
    setTimeout(() => { splash.remove(); }, 650);
  }, remaining);
}

async function dbInsert(table, row) {
  if (!CONFIGURED) return;
  saving = true;
  try {
    const { error } = await sb.from(table).insert(row);
    if (error) throw error;
    lastSync = new Date();
  } catch (e) {
    showToast("Kaydedilemedi: " + (e.message || e));
  } finally {
    saving = false;
  }
}
async function dbUpdate(table, id, patch) {
  if (!CONFIGURED) return;
  saving = true;
  try {
    const { error } = await sb.from(table).update(patch).eq("id", id);
    if (error) throw error;
    lastSync = new Date();
  } catch (e) {
    showToast("Kaydedilemedi: " + (e.message || e));
  } finally {
    saving = false;
  }
}
async function dbDelete(table, id) {
  if (!CONFIGURED) return;
  saving = true;
  try {
    const { error } = await sb.from(table).delete().eq("id", id);
    if (error) throw error;
    lastSync = new Date();
  } catch (e) {

    saving = false;
  }
}

function goTo(next) { screen = next; openBookId = null; render(); }

// ---- ACTIONS ----
function isVerified(teacherId) { try { return localStorage.getItem("verified-" + teacherId) === "1"; } catch(e) { return true; } }
function setVerified(teacherId) { try { localStorage.setItem("verified-" + teacherId, "1"); } catch(e) {} }
function clearVerified(teacherId) { try { localStorage.removeItem("verified-" + teacherId); } catch(e) {} }

function openTeacher(teacherId) {
  const teacher = data.teachers.find(t => t.id === teacherId);
  if (!teacher) return;
  if (teacher.pin && !isVerified(teacherId)) {
    const entered = window.prompt(`${teacher.name} için PIN girin:`);
    if (entered === null) return;
    if (entered.trim() !== teacher.pin) { showToast("Yanlış PIN."); return; }
    setVerified(teacherId);
    showToast("Bu cihazda hatırlanacak, tekrar sorulmayacak.", true);
  }
  goTo({ name: "students", teacherId });
}

function setPinPrompt(teacherId) {
  const teacher = data.teachers.find(t => t.id === teacherId);
  if (!teacher) return;
  if (teacher.pin) {
    const current = window.prompt(`"${teacher.name}" için PIN'i değiştirmek üzeresin. Önce mevcut PIN'i gir:`);
    if (current === null) return;
    if (current.trim() !== teacher.pin) { showToast("Yanlış PIN, değişiklik yapılamadı."); return; }
  }
  const val = window.prompt(`${teacher.name} için yeni 4 haneli PIN belirleyin (kaldırmak için kutuyu boşaltıp Tamam'a basın):`, "");
  if (val === null) return;
  teacher.pin = val.trim() === "" ? null : val.trim();
  if (!teacher.pin) clearVerified(teacherId);
  render();
  dbUpdate("teachers", teacherId, { pin: teacher.pin });
}

function addTeacher(name) {
  name = name.trim(); if (!name) return;
  const t = { id: uid(), name, pin: null, msgTemplate: null, groupHeaderTemplate: null, groupLineTemplate: null };
  data.teachers.push(t);
  render();
  dbInsert("teachers", { id: t.id, name: t.name, pin: null });
}
function removeTeacher(id) {
  const teacher = data.teachers.find(t => t.id === id);
  if (!teacher) return;
  if (teacher.pin) {
    const entered = window.prompt(`"${teacher.name}" silinecek — tüm talebeleri ve okuma kayıtları da gidecek. Onaylamak için PIN girin:`);
    if (entered === null) return;
    if (entered.trim() !== teacher.pin) { showToast("Yanlış PIN, silme işlemi iptal edildi."); return; }
  } else {
    if (!window.confirm(`"${teacher.name}" silinsin mi? Talebeleri ve tüm okuma kayıtları da silinecek. Bu işlem geri alınamaz.`)) return;
  }
  const studentIds = data.students.filter(s => s.teacherId === id).map(s => s.id);
  const bookIds = data.books.filter(b => studentIds.includes(b.studentId)).map(b => b.id);
  data.teachers = data.teachers.filter(t => t.id !== id);
  data.students = data.students.filter(s => s.teacherId !== id);
  data.books = data.books.filter(b => !studentIds.includes(b.studentId));
  data.logs = data.logs.filter(l => !bookIds.includes(l.bookId));
  clearVerified(id);
  render();
  dbDelete("teachers", id); // ON DELETE CASCADE talebeleri/kitapları/kayıtları da siler
}
function addStudent(teacherId, name) {
  name = name.trim(); if (!name) return null;
  const s = { id: uid(), name, teacherId, parentPhone: null };
  data.students.push(s);
  render();
  dbInsert("students", { id: s.id, teacher_id: teacherId, name: s.name, parent_phone: null });
  return s;
}
function normalizePhone(raw) {
  if (!raw) return null;
  let digits = raw.replace(/[^0-9]/g, "");
  if (!digits) return null;
  if (digits.startsWith("0") && digits.length === 11) digits = "90" + digits.slice(1);
  else if (digits.length === 10) digits = "90" + digits;
  return digits;
}
function editParentPhone(studentId) {
  const student = data.students.find(s => s.id === studentId);
  if (!student) return;
  const raw = window.prompt("Velinin WhatsApp numarası (kaldırmak için boş bırakıp Tamam'a basın):", student.parentPhone || "");
  if (raw === null) return;
  student.parentPhone = normalizePhone(raw);
  render();
  dbUpdate("students", studentId, { parent_phone: student.parentPhone });
}

const BADGE_TIERS = [
  { count: 1, label: "İlk Kitap", emoji: "🌱" },
  { count: 3, label: "Bronz Okuyucu", emoji: "🥉" },
  { count: 5, label: "Gümüş Okuyucu", emoji: "🥈" },
  { count: 10, label: "Altın Okuyucu", emoji: "🥇" },
  { count: 20, label: "Elmas Okuyucu", emoji: "💎" },
];
function studentBadge(finishedCount) {
  let current = null;
  for (const tier of BADGE_TIERS) if (finishedCount >= tier.count) current = tier;
  const next = BADGE_TIERS.find(t => t.count > finishedCount) || null;
  return { current, next };
}
function finishedCountOf(studentId) { return data.books.filter(b => b.studentId === studentId && b.status === "finished").length; }
function removeStudent(id, name) {
  if (!window.confirm(`"${name}" silinsin mi? Kitapları ve tüm okuma kayıtları da silinecek. Bu işlem geri alınamaz.`)) return;
  const bookIds = data.books.filter(b => b.studentId === id).map(b => b.id);
  data.students = data.students.filter(s => s.id !== id);
  data.books = data.books.filter(b => b.studentId !== id);
  data.logs = data.logs.filter(l => !bookIds.includes(l.bookId));
  render();
  dbDelete("students", id); // ON DELETE CASCADE kitapları/kayıtları da siler
}
function assignBookToStudent(studentId, libraryBookId) {
  const lib = data.library.find(l => l.id === libraryBookId);
  if (!lib) return;
  const b = { id: uid(), studentId, name: lib.name, totalPages: lib.totalPages, status: "reading", goal: null, libraryBookId: lib.id };
  data.books.push(b);
  goTo({ name: "student", teacherId: screen.teacherId, studentId });
  dbInsert("books", { id: b.id, student_id: studentId, name: b.name, total_pages: b.totalPages, status: "reading", goal: null, library_book_id: lib.id });
  showToast(`"${lib.name}" eklendi.`, true);
}
function addLibraryBookAndAssign(studentId, name, totalRaw, publisherId) {
  name = name.trim(); if (!name) return;

function lastPageOf(bookId) {
  const logs = data.logs.filter(l => l.bookId === bookId).sort((a,b) => (a.ts||0) - (b.ts||0));
  return logs.length ? logs[logs.length - 1].page : 0;
}
function addOrEditGoal(bookId) {
  const book = data.books.find(b => b.id === bookId);
  if (!book) return;
  const raw = window.prompt(
    `"${book.name}" için kaç gün içinde bitirilmesi hedefleniyor?\n(Hedefi kaldırmak için kutuyu boşaltıp Tamam'a basın)`,
    book.goal ? String(Math.max(1, daysBetween(book.goal.startDate, book.goal.targetDate))) : "7"
  );
  if (raw === null) return;
  const trimmed = raw.trim();
  if (trimmed === "") { book.goal = null; render(); dbUpdate("books", bookId, { goal: null }); return; }
  const n = Number(trimmed);
  if (!n || n <= 0 || isNaN(n)) { showToast("Geçerli bir gün sayısı girin."); return; }
  if (book.totalPages == null) { showToast("Hedef koymak için önce kitabın toplam sayfa sayısını girmelisiniz. Kitabı silip toplam sayfa ile yeniden ekleyin."); return; }
  const start = todayISO();
  const target = isoDaysAgo(-Math.round(n));
  book.goal = { startDate: start, targetDate: target, startPage: lastPageOf(bookId) };
  render();
  dbUpdate("books", bookId, { goal: book.goal });
}
function goalStatus(book, lastPage) {
  if (!book.goal) return null;
  const today = todayISO();
  const daysLeft = daysBetween(today, book.goal.targetDate);
  const elapsed = Math.max(0, daysBetween(book.goal.startDate, today));
  const totalGoalDays = Math.max(1, daysBetween(book.goal.startDate, book.goal.targetDate));
  const pagesLeft = Math.max(0, book.totalPages - lastPage);
  const neededPerDay = daysLeft > 0 ? Math.ceil(pagesLeft / daysLeft) : pagesLeft;
  const totalToRead = book.totalPages - book.goal.startPage;
  const frac = Math.min(1, elapsed / totalGoalDays);
  const expectedByNow = book.goal.startPage + totalToRead * frac;
  const diff = Math.round(lastPage - expectedByNow);
  const overdue = daysLeft < 0;
  return { daysLeft, pagesLeft, neededPerDay, diff, overdue };
}
function addLog(bookId, page) {
  const book = data.books.find(b => b.id === bookId);
  if (!book) return;
  const bookLogs = data.logs.filter(l => l.bookId === bookId).sort((a,b) => (a.ts||0) - (b.ts||0));
  const prevPage = bookLogs.length ? bookLogs[bookLogs.length - 1].page : 0;
  if (page < prevPage) {
    showToast(`Son kayıt sayfa ${prevPage}. Bundan düşük bir sayfa girilemez.`);
    return;
  }
  if (book.totalPages != null && page > book.totalPages) {
    showToast(`Bu kitap toplam ${book.totalPages} sayfa. Bundan fazla sayfa girilemez.`);
    return;
  }
  const pagesRead = Math.max(0, page - prevPage);
  const willFinish = book.totalPages != null && page >= book.totalPages;
  const wasAlreadyFinished = book.status === "finished";
  const newLog = { id: uid(), bookId, date: todayISO(), page, pagesRead, finishedOnThis: willFinish, ts: Date.now() };
  data.logs.push(newLog);
  book.status = willFinish ? "finished" : "reading";
  const newlyFinished = willFinish && !wasAlreadyFinished;
  let newBadge = null;
  if (newlyFinished) {
    const before = studentBadge(finishedCountOf(book.studentId) - 1).current;
    const after = studentBadge(finishedCountOf(book.studentId)).current;
    if (after && after !== before) newBadge = after;
  }
  render();
  dbInsert("logs", { id: newLog.id, book_id: bookId, date: newLog.date, page: newLog.page, pages_read: newLog.pagesRead, finished_on_this: newLog.finishedOnThis, ts: newLog.ts });
  if (willFinish !== wasAlreadyFinished || willFinish) dbUpdate("books", bookId, { status: book.status });
  if (newlyFinished) {
    const student = data.students.find(s => s.id === book.studentId);
    let msg = `🎉 ${student ? student.name + " — " : ""}"${book.name}" kitabını bitirdi!`;
    if (newBadge) msg += ` Yeni rozet: ${newBadge.emoji} ${newBadge.label}`;
    showToast(msg, true);
  }
}

function waLink(text, phone) {

function addStyledSheet(wb, name, headers, rows, numericCols) {
  const ws = wb.addWorksheet(name, { views: [{ state: "frozen", ySplit: 1 }] });
  ws.columns = headers.map((h, i) => {
    const maxLen = Math.max(h.length, ...rows.map(r => String(r[i] ?? "").length));
    return { header: h, key: "c" + i, width: Math.min(42, Math.max(11, maxLen + 3)) };
  });
  rows.forEach(r => ws.addRow(r));

  const headerRow = ws.getRow(1);
  headerRow.height = 20;
  headerRow.eachCell(cell => {
    cell.font = { bold: true, color: { argb: "FFFFFFFF" }, size: 11 };
    cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF28334A" } };
    cell.alignment = { vertical: "middle", horizontal: "left" };
    cell.border = { bottom: { style: "thin", color: { argb: "FF1D2A3D" } } };
  });

  const thin = { style: "thin", color: { argb: "FFE2E8F0" } };
  for (let i = 2; i <= rows.length + 1; i++) {
    const row = ws.getRow(i);
    const zebra = i % 2 === 0;
    row.eachCell({ includeEmpty: true }, (cell, colNumber) => {
      cell.border = { top: thin, bottom: thin, left: thin, right: thin };
      if (zebra) cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFF5F7FA" } };
      if (numericCols && numericCols.includes(colNumber - 1)) cell.alignment = { horizontal: "right" };
    });
  }
  ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: headers.length } };
  return ws;
}
async function downloadWorkbook(wb, filename) {
  try {
    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) {
    showToast("Excel oluşturulamadı: " + (e.message || e));
  }
}

function addTitleBlock(ws, span, title, subtitleLines) {
  ws.mergeCells(1, 1, 1, span);
  const titleCell = ws.getCell(1, 1);
  titleCell.value = title;
  titleCell.font = { bold: true, size: 16, color: { argb: "FF1C2333" } };
  titleCell.alignment = { vertical: "middle" };
  ws.getRow(1).height = 26;
  let r = 2;
  subtitleLines.forEach(line => {
    ws.mergeCells(r, 1, r, span);
    const c = ws.getCell(r, 1);
    c.value = line;
    c.font = { size: 11, color: { argb: "FF667085" } };
    r++;
  });
  return r + 1; // sonraki boş satırdan devam
}

function buildDataWorkbook(studentIds, opts) {
  opts = opts || {};
  const teacherById = Object.fromEntries(data.teachers.map(t => [t.id, t]));
  const studentById = Object.fromEntries(data.students.map(s => [s.id, s]));
  const bookById = Object.fromEntries(data.books.map(b => [b.id, b]));
  const publisherById = Object.fromEntries(data.publishers.map(p => [p.id, p]));
  const studentIdSet = new Set(studentIds);
  const relevantBookIds = new Set(data.books.filter(b => studentIdSet.has(b.studentId)).map(b => b.id));

  const detailHeaders = ["Hoca", "Talebe", "Kitap", "Tarih", "Sayfa", "Toplam Sayfa", "Bugün Okunan", "Bitti mi"];
  const detailRows = [];
  data.logs.slice()
    .filter(l => relevantBookIds.has(l.bookId))
    .sort((a, b) => a.date.localeCompare(b.date))
    .forEach(l => {
      const book = bookById[l.bookId]; if (!book) return;
      const student = studentById[book.studentId]; if (!student) return;
      const teacher = teacherById[student.teacherId];
      detailRows.push([teacher ? teacher.name : "", student.name, book.name, fmtDate(l.date), l.page, book.totalPages ?? "", l.pagesRead, l.finishedOnThis ? "Evet" : "Hayır"]);
    });

  const summaryMap = {};
  data.students.filter(s => studentIdSet.has(s.id)).forEach(s => {
    summaryMap[s.id] = { hoca: (teacherById[s.teacherId] && teacherById[s.teacherId].name) || "", isim: s.name, sayfa: 0, bitti: 0 };
  });
  data.logs.forEach(l => {
    const book = bookById[l.bookId]; if (!book) return;
    const row = summaryMap[book.studentId]; if (!row) return;
    row.sayfa += l.pagesRead;
  });
  data.books.forEach(b => { if (b.status === "finished" && summaryMap[b.studentId]) summaryMap[b.studentId].bitti++; });
  const summaryHeaders = ["Hoca", "Talebe", "Toplam Okunan Sayfa", "Bitirilen Kitap"];
  const summaryRows = Object.values(summaryMap).sort((a, b) => b.sayfa - a.sayfa)
    .map(s => [s.hoca, s.isim, s.sayfa, s.bitti]);

  const wb = new ExcelJS.Workbook();
  wb.creator = "Takip Defteri";
  wb.created = new Date();
  addStyledSheet(wb, "Özet", summaryHeaders, summaryRows, [2, 3]);
  addStyledSheet(wb, "Okuma Kayıtları", detailHeaders, detailRows, [4, 5, 6]);

  if (opts.includeLibrary) {
    const relevantLibIds = new Set(data.books.filter(b => studentIdSet.has(b.studentId) && b.libraryBookId).map(b => b.libraryBookId));
    const libraryHeaders = ["Kitap", "Kitap Evi", "Toplam Sayfa", "Kaç Talebede", "Bitiren", "Toplam Okunan Sayfa"];
    const libraryRows = data.library.filter(l => relevantLibIds.has(l.id)).map(l => {
      const instances = data.books.filter(b => b.libraryBookId === l.id && studentIdSet.has(b.studentId));
      const finishedCount = instances.filter(b => b.status === "finished").length;
      const pagesRead = data.logs.filter(log => instances.some(b => b.id === log.bookId)).reduce((sum, log) => sum + log.pagesRead, 0);
      const pub = l.publisherId ? publisherById[l.publisherId] : null;
      return [l.name, pub ? pub.name : "Kategorisiz", l.totalPages ?? "", instances.length, finishedCount, pagesRead];
    }).sort((a, b) => b[5] - a[5]);
    if (libraryRows.length > 0) addStyledSheet(wb, "Kütüphane", libraryHeaders, libraryRows, [2, 3, 4, 5]);

    const publisherMap = {};
    data.publishers.forEach(p => { publisherMap[p.id] = { isim: p.name, kitapSayisi: 0, atanma: 0, bitiren: 0, sayfa: 0 }; });
    publisherMap["__none__"] = { isim: "Kategorisiz", kitapSayisi: 0, atanma: 0, bitiren: 0, sayfa: 0 };
    data.library.filter(l => relevantLibIds.has(l.id)).forEach(l => {
      const key = l.publisherId && publisherMap[l.publisherId] ? l.publisherId : "__none__";
      const instances = data.books.filter(b => b.libraryBookId === l.id && studentIdSet.has(b.studentId));
      const finishedCount = instances.filter(b => b.status === "finished").length;
      const pagesRead = data.logs.filter(log => instances.some(b => b.id === log.bookId)).reduce((sum, log) => sum + log.pagesRead, 0);
      publisherMap[key].kitapSayisi++;
      publisherMap[key].atanma += instances.length;
      publisherMap[key].bitiren += finishedCount;
      publisherMap[key].sayfa += pagesRead;
    });
    const publisherHeaders = ["Kitap Evi", "Kitap Sayısı", "Talebeye Atanma", "Bitiren Talebe", "Toplam Okunan Sayfa"];
    const publisherRows = Object.values(publisherMap).filter(p => p.kitapSayisi > 0).sort((a, b) => b.sayfa - a.sayfa)
      .map(p => [p.isim, p.kitapSayisi, p.atanma, p.bitiren, p.sayfa]);
    if (publisherRows.length > 0) addStyledSheet(wb, "Kitap Evleri", publisherHeaders, publisherRows, [1, 2, 3, 4]);
  }
  return wb;
}

const DEFAULT_MSG_TEMPLATE = `📖 *{talebe}* — {kitap}\nBugün sayfa {sayfa}'e kadar okudu (+{okunan} sayfa).\n{bitti}`;
const DEFAULT_GROUP_HEADER = `📚 *{hoca}* — {tarih} Okuma Raporu`;
const DEFAULT_GROUP_LINE = `• {talebe}: {kitap} — sayfa {sayfa} (+{okunan}){bitti}`;

function fillTemplate(tpl, vars) {
  const out = tpl.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? vars[k] : ""));
  return out.replace(/\n{2,}/g, "\n").trim();
}
function studentMessage(teacher, student, book, log) {
  const tpl = (teacher && teacher.msgTemplate) || DEFAULT_MSG_TEMPLATE;
  return fillTemplate(tpl, {
    talebe: student.name, kitap: book.name, sayfa: log.page,
    toplam: book.totalPages != null ? book.totalPages : "", okunan: log.pagesRead,
    bitti: log.finishedOnThis ? "✅ Kitabı bitirdi, maşallah!" : ""
  });
}
function groupDailyMessage(teacher, date, dayLogs, studentById, bookById) {
  const headerTpl = (teacher && teacher.groupHeaderTemplate) || DEFAULT_GROUP_HEADER;
  const lineTpl = (teacher && teacher.groupLineTemplate) || DEFAULT_GROUP_LINE;
  let lines = [fillTemplate(headerTpl, { hoca: teacher.name, tarih: fmtDate(date) }), ""];
  if (dayLogs.length === 0) lines.push("Bugün kayıt girilmedi.");
  else dayLogs.forEach(l => {
    const book = bookById[l.bookId]; const student = studentById[book.studentId];
    lines.push(fillTemplate(lineTpl, { talebe: student.name, kitap: book.name, sayfa: l.page, okunan: l.pagesRead, bitti: l.finishedOnThis ? " ✅ bitirdi" : "" }));
  });
  return lines.join("\n");
}

  if (screen.name === "teachers") app.innerHTML = renderTeachers();
  else if (screen.name === "students") app.innerHTML = renderStudents(screen.teacherId);
  else if (screen.name === "student") app.innerHTML = renderStudent(screen.teacherId, screen.studentId);
  else if (screen.name === "history") app.innerHTML = renderHistory(screen.teacherId);
  else if (screen.name === "stats") app.innerHTML = renderStats(screen.teacherId);
  else if (screen.name === "studentSettings") app.innerHTML = renderStudentSettings(screen.teacherId, screen.studentId);

}

function daysBetween(aISO, bISO) {
  const a = new Date(aISO + "T00:00:00");
  const b = new Date(bISO + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
const STALE_THRESHOLD = 3;
function studentAlert(studentId) {
  const books = data.books.filter(b => b.studentId === studentId && b.status !== "finished");
  if (books.length === 0) return null;
  const bookIds = books.map(b => b.id);
  const logs = data.logs.filter(l => bookIds.includes(l.bookId));
  if (logs.length === 0) return { type: "never" };
  const lastDate = logs.reduce((max, l) => (l.date > max ? l.date : max), logs[0].date);
  const days = daysBetween(lastDate, todayISO());
  if (days >= STALE_THRESHOLD) return { type: "stale", days };
  return null;
}

function renderLibraryBookRow(l) {
  const studentById = Object.fromEntries(data.students.map(s => [s.id, s]));
  const teacherById = Object.fromEntries(data.teachers.map(t => [t.id, t]));
  const instances = data.books.filter(b => b.libraryBookId === l.id);
  const usageCount = instances.length;

  const readers = instances.map(b => {
    const student = studentById[b.studentId];
    const teacher = student ? teacherById[student.teacherId] : null;
    const lastPage = lastPageOf(b.id);
    const finished = b.status === "finished";
    return { student, teacher, lastPage, finished, totalPages: b.totalPages };
  }).filter(r => r.student).sort((a, b) => (a.finished === b.finished ? 0 : a.finished ? 1 : -1));

  const readerList = readers.length ? readers.map(r => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--paper-line);">
      <div>
        <div style="font-weight:600;font-size:13.5px;">${esc(r.student.name)}</div>

      </div>
      <div style="text-align:right;">
        <div class="kd-mono" style="font-size:13px;">${r.lastPage}${r.totalPages ? ` / ${r.totalPages}` : ""}</div>
        <div style="font-size:11px;color:${r.finished ? "var(--gold)" : "var(--ink-soft)"};font-weight:${r.finished ? "700" : "400"};">${r.finished ? "✅ Bitirdi" : "Okuyor"}</div>
      </div>
    </div>`).join("") : `<div style="padding:8px 0;color:var(--ink-soft);font-size:13px;">Henüz kimse okumuyor.</div>`;

  return `
    <div class="card" style="padding:12px 14px;margin-bottom:8px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div style="font-weight:700;">${esc(l.name)}</div>
          <div class="name-sub kd-mono">${l.totalPages ? l.totalPages + " sayfa" : "sayfa sayısı girilmemiş"}${usageCount > 0 ? ` · ${usageCount} talebede okunuyor/okundu` : " · henüz kimsede yok"}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <button class="icon-btn" data-remove-library="${l.id}" data-library-name="${esc(l.name)}" title="Kütüphaneden sil">${ic.trash}</button>
        </div>
      </div>
      ${usageCount > 0 ? `<div style="margin-top:4px;">${readerList}</div>` : ""}
    </div>`;
}

function renderStudents(teacherId) {
  const teacher = data.teachers.find(t => t.id === teacherId);
  if (!teacher) { goTo({ name: "teachers" }); return ""; }
  const students = data.students.filter(s => s.teacherId === teacherId);
  const alertMap = {};
  students.forEach(s => { const a = studentAlert(s.id); if (a) alertMap[s.id] = a; });
  const alertList = students.filter(s => alertMap[s.id]);

  const alertBox = alertList.length ? `
    <div class="card" style="border-color:#C9973B;background:#FBF3E1;padding:14px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;">
      <span style="color:#A8791F;flex-shrink:0;margin-top:2px;">${ic.alert}</span>
      <div style="font-size:13.5px;">
        <div style="font-weight:700;margin-bottom:4px;">Takibe alınması gereken talebeler</div>
        ${alertList.map(s => `<div>${esc(s.name)} — ${alertMap[s.id].type === "never" ? "henüz hiç okuma kaydı girilmedi" : `${alertMap[s.id].days} gündür kayıt yok`}</div>`).join("")}
      </div>
    </div>` : "";

  const goalAlerts = [];
  students.forEach(s => {
    data.books.filter(b => b.studentId === s.id && b.status !== "finished" && b.goal).forEach(b => {
      const g = goalStatus(b, lastPageOf(b.id));
      if (g.overdue) goalAlerts.push(`${s.name} — "${b.name}" hedef tarihi geçti (${Math.abs(g.daysLeft)} gün gecikme)`);
      else if (g.diff < 0) goalAlerts.push(`${s.name} — "${b.name}" hedefin ${Math.abs(g.diff)} sayfa gerisinde`);
    });
  });
  const goalAlertBox = goalAlerts.length ? `
    <div class="card" style="border-color:#C97A7A;background:#FBEAEA;padding:14px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;">
      <span style="color:var(--ribbon-dark);flex-shrink:0;margin-top:2px;">${ic.target}</span>
      <div style="font-size:13.5px;">
        <div style="font-weight:700;margin-bottom:4px;">Hedefin gerisinde kalanlar</div>
        ${goalAlerts.map(t => `<div>${esc(t)}</div>`).join("")}
      </div>
    </div>` : "";

  const query = (screen.studentSearch || "").trim();

  const rows = students.map(s => {
    const books = data.books.filter(b => b.studentId === s.id);
    const active = books.filter(b => b.status !== "finished").length;
    const finished = books.filter(b => b.status === "finished").length;
    const a = alertMap[s.id];
    const warn = a ? ` <span style="color:#A8791F;font-weight:700;">· ${a.type === "never" ? "kayıt yok" : `${a.days}g kayıt yok`}</span>` : "";
    const badge = studentBadge(finished).current;
    const badgeTag = badge ? ` <span title="${esc(badge.label)}">${badge.emoji}</span>` : "";
    return `
      <div class="card row student-row" tabindex="0" data-goto="student" data-teacher="${teacherId}" data-student="${s.id}" data-search-name="${esc(s.name.toLocaleLowerCase("tr"))}">
        <div><div class="name-title">${esc(s.name)}${badgeTag}</div><div class="name-sub">${active} okunuyor${finished > 0 ? ` · ${finished} bitti` : ""}${warn}</div></div>
        <div style="display:flex;align-items:center;gap:6px;">
          <button class="icon-btn" data-goto="studentSettings" data-teacher="${teacherId}" data-student="${s.id}" title="Talebe ayarları">${ic.gear}</button>
          <button class="icon-btn" data-remove-student="${s.id}" data-student-name="${esc(s.name)}">${ic.trash}</button>
        </div>
      </div>`;
  }).join("");
  return `
    ${headerHtml(teacher.name, "Talebeleri", true, `
      <button class="btn-outline" data-goto="stats" data-teacher="${teacherId}">${ic.trend} İstatistik</button>
      <button class="btn-dark" data-goto="history" data-teacher="${teacherId}">${ic.calendar} Geçmiş / Rapor</button>
      <button class="btn-outline" id="export-class-btn" data-teacher="${teacherId}">${ic.copy} Sınıf Raporu (Excel)</button>
      ${teacher.pin ? `<button class="btn-outline" data-lock-out="${teacherId}">${ic.lock} Kilitle</button>` : ""}
      <button class="btn-outline" data-goto="messageTemplates" data-teacher="${teacherId}">${ic.edit} Mesaj Şablonu</button>
    `)}
    <div class="add-row">
      <input class="kd-input flex1" id="new-student" placeholder="Yeni talebe adı" />
      <button class="btn-primary" id="add-student-btn" data-teacher="${teacherId}">${ic.plus} Talebe Ekle</button>
    </div>
    ${students.length > 4 ? `<div class="add-row"><input class="kd-input flex1" id="student-search" placeholder="Talebe ara…" value="${esc(query)}" /></div>` : ""}
    ${alertBox}
    ${goalAlertBox}
    ${students.length === 0 ? emptyHtml(ic.userBig, "Bu hocanın henüz talebesi yok. Yukarıdan ekleyin.") : `<div>${rows}</div>`}

    <div class="card" style="padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:14px;">

function renderBookCard(student, book) {
  const logs = data.logs.filter(l => l.bookId === book.id).sort((a,b) => (b.ts||0) - (a.ts||0));
  const lastPage = logs.length ? logs[0].page : 0;
  const finished = book.status === "finished";
  const pct = book.totalPages ? Math.min(100, Math.round((lastPage / book.totalPages) * 100)) : null;
  const open = openBookId === book.id;
  const goal = (!finished && book.goal) ? goalStatus(book, lastPage) : null;
  const historyItems = logs.length === 0 ? `<div style="font-size:13px;color:var(--ink-soft);">Henüz kayıt yok.</div>` :
    logs.map(l => `
      <div class="history-item">
        <span class="d">${fmtDate(l.date)}</span>
        <span style="display:flex;align-items:center;gap:8px;">
          <span class="kd-mono">sayfa ${l.page} <span style="color:var(--ink-soft);">(+${l.pagesRead})</span>${l.finishedOnThis ? ` <span style="color:var(--gold);">${ic.check}</span>` : ""}</span>
          <button class="icon-btn" data-send-log="${l.id}" data-book="${book.id}" title="Bu kaydı gönder">${ic.send}</button>
        </span>
      </div>`).join("");

  let goalBox = "";
  if (goal) {
    const behind = goal.diff < 0;
    const bg = goal.overdue ? "#FBEAEA" : (behind ? "#FBF3E1" : "#EAF3EC");
    const fg = goal.overdue ? "var(--ribbon-dark)" : (behind ? "#A8791F" : "var(--green)");
    const headline = goal.overdue
      ? `⚠ Hedef tarih geçti (${Math.abs(goal.daysLeft)} gün gecikme)`
      : (behind ? `⚠ Hedefin ${Math.abs(goal.diff)} sayfa gerisinde` : `✅ Hedefte yolunda`);
    goalBox = `
      <div style="margin:0 14px 12px;padding:9px 11px;border-radius:8px;background:${bg};font-size:12.5px;">
        <div style="font-weight:700;color:${fg};">${headline}</div>
        <div class="kd-mono" style="color:var(--ink-soft);margin-top:2px;">
          ${fmtDate(book.goal.targetDate)}'e kadar · ${goal.pagesLeft} sayfa kaldı${!goal.overdue ? ` · günde ~${goal.neededPerDay} sayfa gerekiyor` : ""}
        </div>
      </div>`;
  } else if (!finished && !book.goal) {
    goalBox = `
      <div style="margin:0 14px 12px;">
        <button class="btn-outline" data-set-goal="${book.id}" style="font-size:12px;padding:6px 10px;">${ic.target} Hedef Koy</button>
      </div>`;
  }

  return `
    <div class="card book-card">
      <div class="book-top">
        <div class="book-icon" style="background:${finished ? "var(--gold)" : "var(--ribbon)"};">${finished ? ic.check : ic.book}</div>
        <div class="book-info" data-toggle-book="${book.id}">
          <div class="book-name">${esc(book.name)}</div>
          <div class="book-pages kd-mono">${lastPage}${book.totalPages ? ` / ${book.totalPages} sayfa` : " sayfa"} ${finished ? "· Bitirdi" : ""}</div>
          ${pct != null ? `<div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${finished ? "var(--gold)" : "var(--ribbon)"};"></div></div>` : ""}
        </div>
        ${!finished && book.goal ? `<button class="icon-btn" data-set-goal="${book.id}" title="Hedefi düzenle">${ic.target}</button>` : ""}
        <button class="icon-btn" data-remove-book="${book.id}" data-book-name="${esc(book.name)}">${ic.trash}</button>
      </div>
      ${goalBox}
      <div class="book-log-row">
        <input class="kd-input kd-mono flex1" type="number" min="${lastPage}" ${book.totalPages != null ? `max="${book.totalPages}"` : ""} placeholder="Bugün kaçıncı sayfada (son: ${lastPage})" id="page-input-${book.id}" />
        <button class="btn-save" data-save-log="${book.id}">Kaydet</button>
      </div>
      <div class="history-panel ${open ? "open" : ""}" id="history-${book.id}">
        <div class="history-label">Okuma Geçmişi</div>
        ${historyItems}
      </div>
    </div>`;
}

function isoDaysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); }
function shortDayMonth(iso) { const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString("tr-TR", { day: "2-digit", month: "2-digit" }); }

function renderStats(teacherId) {
  const teacher = data.teachers.find(t => t.id === teacherId);
  if (!teacher) { goTo({ name: "teachers" }); return ""; }
  const period = screen.statPeriod || 7;
  const studentFilter = screen.statStudent || "all";
  const studentsOfTeacher = data.students.filter(s => s.teacherId === teacherId);
  const relevantBookIds = new Set(
    data.books
      .filter(b => studentsOfTeacher.some(s => s.id === b.studentId) && (studentFilter === "all" || b.studentId === studentFilter))
      .map(b => b.id)
  );

  const dateList = [];
  for (let i = period - 1; i >= 0; i--) dateList.push(isoDaysAgo(i));

  const totalsByDate = {};
  dateList.forEach(d => totalsByDate[d] = 0);
  data.logs.forEach(l => {
    if (relevantBookIds.has(l.bookId) && totalsByDate.hasOwnProperty(l.date)) totalsByDate[l.date] += l.pagesRead;
  });

  const values = dateList.map(d => totalsByDate[d]);
  const maxVal = Math.max(1, ...values);
  const grandTotal = values.reduce((a, b) => a + b, 0);
  const avg = period > 0 ? Math.round((grandTotal / period) * 10) / 10 : 0;
  const activeDays = values.filter(v => v > 0).length;

  const finishedInPeriod = data.logs.filter(l => relevantBookIds.has(l.bookId) && l.finishedOnThis && dateList.includes(l.date)).length;

  const barW = period <= 7 ? 46 : (period <= 14 ? 26 : 12);
  const gap = period <= 7 ? 14 : (period <= 14 ? 8 : 4);
  const chartH = 160;
  const chartW = dateList.length * (barW + gap) + gap;
  const labelEvery = period <= 7 ? 1 : (period <= 14 ? 2 : 5);

  const bars = dateList.map((d, i) => {
    const v = totalsByDate[d];
    const h = Math.round((v / maxVal) * (chartH - 30));
    const x = gap + i * (barW + gap);
    const y = chartH - h - 20;
    const showLabel = (dateList.length - 1 - i) % labelEvery === 0;
    return `
      <g>
        <rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="3" fill="${v > 0 ? 'var(--ribbon)' : 'var(--paper-line)'}"></rect>
        ${v > 0 && period <= 7 ? `<text x="${x + barW/2}" y="${y - 6}" text-anchor="middle" font-size="11" fill="var(--ink)" font-family="JetBrains Mono, monospace">${v}</text>` : ""}
        ${showLabel ? `<text x="${x + barW/2}" y="${chartH - 4}" text-anchor="middle" font-size="9" fill="var(--ink-soft)">${shortDayMonth(d)}</text>` : ""}
      </g>`;
  }).join("");

  const studentOptions = studentsOfTeacher.map(s => `<option value="${s.id}" ${studentFilter === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("");

  let leaderboardBox = "";
  if (studentFilter === "all" && studentsOfTeacher.length > 1) {
    const perStudent = studentsOfTeacher.map(s => {
      const bookIds = new Set(data.books.filter(b => b.studentId === s.id).map(b => b.id));
      const pages = data.logs.filter(l => bookIds.has(l.bookId) && dateList.includes(l.date)).reduce((sum, l) => sum + l.pagesRead, 0);
      return { name: s.name, pages };
    }).filter(s => s.pages > 0).sort((a, b) => b.pages - a.pages).slice(0, 5);
    const medals = ["🥇", "🥈", "🥉"];
    if (perStudent.length > 0) {
      leaderboardBox = `
        <div class="card" style="padding:16px;margin-top:16px;">
          <div style="font-weight:700;margin-bottom:10px;">🏆 Bu Dönemde En Çok Okuyanlar</div>
          ${perStudent.map((s, i) => `
            <div style="display:flex;justify-content:space-between;padding:6px 0;${i > 0 ? "border-top:1px solid var(--paper-line);" : ""}">
              <span>${medals[i] || (i + 1) + "."} ${esc(s.name)}</span>
              <span class="kd-mono">${s.pages} sayfa</span>
            </div>`).join("")}
        </div>`;
    }
  }

  return `
    ${headerHtml("İstatistik", teacher.name, true)}
    <div class="add-row" style="align-items:center;">
      <button class="btn-outline" data-period="7" style="${period === 7 ? 'background:var(--ink);color:var(--paper);' : ''}">7 Gün</button>
      <button class="btn-outline" data-period="30" style="${period === 30 ? 'background:var(--ink);color:var(--paper);' : ''}">30 Gün</button>
      <select class="kd-input flex1" id="stats-student-select">
        <option value="all" ${studentFilter === "all" ? "selected" : ""}>Tüm Talebeler</option>
        ${studentOptions}
      </select>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="stat-icon">${ic.trend}</div><div class="stat-value">${grandTotal}</div><div class="stat-label">Toplam sayfa (${period} gün)</div></div>
      <div class="stat-card"><div class="stat-icon">${ic.calendar}</div><div class="stat-value">${avg}</div><div class="stat-label">Günlük ortalama</div></div>
      <div class="stat-card"><div class="stat-icon">${ic.check}</div><div class="stat-value">${finishedInPeriod}</div><div class="stat-label">Bitirilen kitap</div></div>
    </div>

    <div class="card" style="padding:16px; overflow-x:auto;">
      ${grandTotal === 0
        ? emptyHtml(ic.trend, "Bu dönemde henüz kayıt yok.")
        : `<svg viewBox="0 0 ${chartW} ${chartH}" width="${Math.max(chartW, 300)}" height="${chartH}">${bars}</svg>`}
    </div>
    <div class="subtitle" style="margin-top:10px;">${activeDays} / ${period} günde kayıt girilmiş.</div>
    ${leaderboardBox}
  `;
}

function buildPrintReport(teacherId, date) {
  const teacher = data.teachers.find(t => t.id === teacherId);
  const studentIds = new Set(data.students.filter(s => s.teacherId === teacherId).map(s => s.id));
  const bookById = Object.fromEntries(data.books.map(b => [b.id, b]));
  const studentById = Object.fromEntries(data.students.map(s => [s.id, s]));
  const dayLogs = data.logs
    .filter(l => { const b = bookById[l.bookId]; return l.date === date && b && studentIds.has(b.studentId); })
    .sort((a, b) => {
      const sa = studentById[bookById[a.bookId].studentId]?.name || "";
      const sb = studentById[bookById[b.bookId].studentId]?.name || "";
      return sa.localeCompare(sb, "tr");
    });
  const totalPages = dayLogs.reduce((sum, l) => sum + l.pagesRead, 0);
  const finishedToday = dayLogs.filter(l => l.finishedOnThis).length;
  const uniqueStudents = new Set(dayLogs.map(l => bookById[l.bookId].studentId)).size;

  const rows = dayLogs.map(l => {
    const book = bookById[l.bookId];
    const student = studentById[book.studentId];
    return `<tr>
      <td>${esc(student ? student.name : "—")}</td>
      <td>${esc(book.name)}</td>
      <td>${l.page}${book.totalPages ? " / " + book.totalPages : ""}</td>
      <td>+${l.pagesRead}</td>
      <td>${l.finishedOnThis ? "Bitirdi" : ""}</td>
    </tr>`;
  }).join("");

  const html = `
    <div class="pr-head">
      <div>
        <div class="pr-brand">Takip Defteri</div>
        <div class="pr-title">${esc(teacher ? teacher.name : "")} — Günlük Okuma Raporu</div>
      </div>
      <div class="pr-meta">
        Rapor tarihi: ${fmtDate(date)}<br>
        Oluşturulma: ${new Date().toLocaleString("tr-TR")}
      </div>
    </div>
    <div class="pr-summary">
      <div>Toplam okunan sayfa <b>${totalPages}</b></div>
      <div>Bitirilen kitap <b>${finishedToday}</b></div>
      <div>Kayıt giren talebe <b>${uniqueStudents}</b></div>
    </div>
    ${dayLogs.length === 0 ? `<div class="pr-empty">Bu tarihte kayıt girilmemiş.</div>` : `
      <table>
        <thead><tr><th>Talebe</th><th>Kitap</th><th>Sayfa</th><th>Bugün Okunan</th><th>Durum</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `}
    <div class="pr-footer">Takip Defteri — otomatik oluşturulmuş rapor.</div>
  `;
  document.getElementById("print-area").innerHTML = html;
}

function bindEvents() {
  document.querySelectorAll("[data-back]").forEach(el => el.addEventListener("click", () => {
    if (screen.name === "students") goTo({ name: "teachers" });
    else if (screen.name === "student") goTo({ name: "students", teacherId: screen.teacherId });
    else if (screen.name === "history") goTo({ name: "students", teacherId: screen.teacherId });
    else if (screen.name === "stats") goTo({ name: "students", teacherId: screen.teacherId });
    else if (screen.name === "studentSettings") goTo({ name: "student", teacherId: screen.teacherId, studentId: screen.studentId });
    else if (screen.name === "messageTemplates") goTo({ name: "students", teacherId: screen.teacherId });
    else if (screen.name === "library") goTo({ name: "teachers" });
    else if (screen.name === "selectBook") goTo({ name: "student", teacherId: screen.teacherId, studentId: screen.studentId });
  }));

  const refreshBtn = document.querySelector("[data-refresh]");
  if (refreshBtn) refreshBtn.addEventListener("click", manualRefresh);

  document.querySelectorAll("[data-goto]").forEach(el => {
    const go = (e) => { if (e) e.stopPropagation(); goTo({ name: el.getAttribute("data-goto"), teacherId: el.getAttribute("data-teacher"), studentId: el.getAttribute("data-student") }); };
    el.addEventListener("click", go);
    el.addEventListener("keydown", e => { if (e.key === "Enter") go(e); });
  });

  document.querySelectorAll("[data-open-teacher]").forEach(el => {
    const open = () => openTeacher(el.getAttribute("data-open-teacher"));
    el.addEventListener("click", open);
    el.addEventListener("keydown", e => { if (e.key === "Enter") open(); });
  });
  document.querySelectorAll("[data-set-pin]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); setPinPrompt(el.getAttribute("data-set-pin")); }));
  document.querySelectorAll("[data-set-goal]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); addOrEditGoal(el.getAttribute("data-set-goal")); }));
  document.querySelectorAll("[data-lock-out]").forEach(el => el.addEventListener("click", () => {
    const teacherId = el.getAttribute("data-lock-out");
    clearVerified(teacherId);
    goTo({ name: "teachers" });
  }));

  const exportBtn = document.getElementById("export-csv-btn");
  if (exportBtn) exportBtn.addEventListener("click", exportExcel);
  const exportClassBtn = document.getElementById("export-class-btn");
  if (exportClassBtn) exportClassBtn.addEventListener("click", () => exportTeacherExcel(exportClassBtn.getAttribute("data-teacher")));
  const exportStudentBtn = document.getElementById("export-student-btn");
  if (exportStudentBtn) exportStudentBtn.addEventListener("click", () => exportStudentExcel(exportStudentBtn.getAttribute("data-student")));

  const addTeacherBtn = document.getElementById("add-teacher-btn");
  if (addTeacherBtn) {
    const input = document.getElementById("new-teacher");
    const submit = () => addTeacher(input.value);
    addTeacherBtn.addEventListener("click", submit);
    input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  }
  const addStudentBtn = document.getElementById("add-student-btn");
  if (addStudentBtn) {
    const input = document.getElementById("new-student");
    const teacherId = addStudentBtn.getAttribute("data-teacher");
    const submit = () => { addStudent(teacherId, input.value); };
    addStudentBtn.addEventListener("click", submit);
    input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  }
  const libAddBtn = document.getElementById("lib-add-btn");
  if (libAddBtn) {
    const nameInput = document.getElementById("lib-name");
    const pagesInput = document.getElementById("lib-pages");
    const pubSelect = document.getElementById("lib-publisher");
    const submit = () => { addLibraryBook(nameInput.value, pagesInput.value, pubSelect ? pubSelect.value : ""); nameInput.value = ""; pagesInput.value = ""; };
    libAddBtn.addEventListener("click", submit);
    nameInput.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
    pagesInput.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  }
  const pubAddBtn = document.getElementById("pub-add-btn");
  if (pubAddBtn) {
    const pubInput = document.getElementById("pub-name");
    const submit = () => { addPublisher(pubInput.value); pubInput.value = ""; };
    pubAddBtn.addEventListener("click", submit);
    pubInput.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  }
  document.querySelectorAll("[data-remove-publisher]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); removePublisher(el.getAttribute("data-remove-publisher"), el.getAttribute("data-publisher-name")); }));
  document.querySelectorAll("[data-remove-library]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); removeLibraryBook(el.getAttribute("data-remove-library"), el.getAttribute("data-library-name")); }));

  document.querySelectorAll("[data-assign-book]").forEach(el => el.addEventListener("click", () => assignBookToStudent(el.getAttribute("data-student"), el.getAttribute("data-assign-book"))));

  const newLibAssignBtn = document.getElementById("new-lib-assign-btn");
  if (newLibAssignBtn) {
    const nameInput = document.getElementById("new-lib-name");
    const pagesInput = document.getElementById("new-lib-pages");
    const pubSelect = document.getElementById("new-lib-publisher");
    const studentId = newLibAssignBtn.getAttribute("data-student");
    const submit = () => addLibraryBookAndAssign(studentId, nameInput.value, pagesInput.value, pubSelect ? pubSelect.value : "");
    newLibAssignBtn.addEventListener("click", submit);
    nameInput.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
    pagesInput.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  }
  const selectBookSearch = document.getElementById("select-book-search");
  if (selectBookSearch) {
    selectBookSearch.addEventListener("input", () => {
      screen.librarySearch = selectBookSearch.value;
      const q = selectBookSearch.value.trim().toLocaleLowerCase("tr");
      document.querySelectorAll(".select-book-row").forEach(row => {
        const name = row.getAttribute("data-search-name") || "";
        row.style.display = name.includes(q) ? "" : "none";
      });
    });
  }

  document.querySelectorAll("[data-remove-teacher]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); removeTeacher(el.getAttribute("data-remove-teacher")); }));
  document.querySelectorAll("[data-remove-student]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); removeStudent(el.getAttribute("data-remove-student"), el.getAttribute("data-student-name")); }));
  document.querySelectorAll("[data-edit-phone]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); editParentPhone(el.getAttribute("data-edit-phone")); }));
  document.querySelectorAll("[data-remove-book]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); removeBook(el.getAttribute("data-remove-book"), el.getAttribute("data-book-name")); }));
  document.querySelectorAll("[data-toggle-book]").forEach(el => el.addEventListener("click", () => { const id = el.getAttribute("data-toggle-book"); openBookId = openBookId === id ? null : id; render(); }));
  document.querySelectorAll("[data-toggle-library]").forEach(el => el.addEventListener("click", () => { const id = el.getAttribute("data-toggle-library"); openLibraryId = openLibraryId === id ? null : id; render(); }));

  document.querySelectorAll("[data-save-log]").forEach(el => {
    const bookId = el.getAttribute("data-save-log");
    const input = document.getElementById(`page-input-${bookId}`);
    const submit = () => {
      const p = Number(input.value);
      if (!input.value || isNaN(p) || p < 0) return;
      addLog(bookId, p);
    };
    el.addEventListener("click", submit);
    if (input) input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  });

  document.querySelectorAll("[data-send-log]").forEach(el => el.addEventListener("click", () => {
    const logId = el.getAttribute("data-send-log");
    const bookId = el.getAttribute("data-book");
    const log = data.logs.find(l => l.id === logId);
    const book = data.books.find(b => b.id === bookId);
    const student = data.students.find(s => s.id === book.studentId);
    const teacher = data.teachers.find(t => t.id === student.teacherId);
    const msg = studentMessage(teacher, student, book, log);
    window.open(waLink(msg, student.parentPhone), "_blank");
  }));

  const tplSaveBtn = document.getElementById("tpl-save-btn");
  if (tplSaveBtn) tplSaveBtn.addEventListener("click", () => {
    const teacher = data.teachers.find(t => t.id === screen.teacherId);
    if (!teacher) return;
    teacher.msgTemplate = document.getElementById("tpl-student").value;
    teacher.groupHeaderTemplate = document.getElementById("tpl-group-header").value;
    teacher.groupLineTemplate = document.getElementById("tpl-group-line").value;
    render();
    dbUpdate("teachers", teacher.id, { msg_template: teacher.msgTemplate, group_header_template: teacher.groupHeaderTemplate, group_line_template: teacher.groupLineTemplate });
    showToast("Mesaj şablonları kaydedildi.", true);
  });
  const tplResetBtn = document.getElementById("tpl-reset-btn");
  if (tplResetBtn) tplResetBtn.addEventListener("click", () => {
    const teacher = data.teachers.find(t => t.id === screen.teacherId);
    if (!teacher) return;
    if (!window.confirm("Bu hocanın mesaj şablonları varsayılana döndürülsün mü?")) return;
    teacher.msgTemplate = null;
    teacher.groupHeaderTemplate = null;
    teacher.groupLineTemplate = null;
    render();
    dbUpdate("teachers", teacher.id, { msg_template: null, group_header_template: null, group_line_template: null });
  });

  const settingsSaveBtn = document.getElementById("settings-save-btn");
  if (settingsSaveBtn) settingsSaveBtn.addEventListener("click", () => {
    const student = data.students.find(s => s.id === screen.studentId);
    if (!student) return;
    const newName = document.getElementById("settings-name").value.trim();
    if (!newName) { showToast("İsim boş olamaz."); return; }
    student.name = newName;
    student.parentPhone = normalizePhone(document.getElementById("settings-phone").value);
    render();
    dbUpdate("students", student.id, { name: student.name, parent_phone: student.parentPhone });
    showToast("Kaydedildi.", true);
  });
  const settingsDeleteBtn = document.getElementById("settings-delete-btn");
  if (settingsDeleteBtn) settingsDeleteBtn.addEventListener("click", () => {
    const student = data.students.find(s => s.id === screen.studentId);
    if (!student) return;
    const targetTeacherId = screen.teacherId;
    const studentId = student.id, studentName = student.name;
    removeStudent(studentId, studentName);
    if (!data.students.find(s => s.id === studentId)) goTo({ name: "students", teacherId: targetTeacherId });
  });

  const printBtn = document.getElementById("print-report-btn");
  if (printBtn) printBtn.addEventListener("click", () => {
    buildPrintReport(screen.teacherId, screen.date || todayISO());
    window.print();
  });

  const studentSearch = document.getElementById("student-search");
  if (studentSearch) {
    studentSearch.addEventListener("input", () => {
      screen.studentSearch = studentSearch.value;
      const q = studentSearch.value.trim().toLocaleLowerCase("tr");
      document.querySelectorAll(".student-row").forEach(row => {
        const name = row.getAttribute("data-search-name") || "";
        row.style.display = name.includes(q) ? "" : "none";
      });
    });
  }

  const historyDate = document.getElementById("history-date");
  if (historyDate) historyDate.addEventListener("change", () => { screen.date = historyDate.value; render(); });

  const groupWaBtn = document.getElementById("group-wa-btn");
  if (groupWaBtn) groupWaBtn.addEventListener("click", () => {
    const text = document.getElementById("group-msg").value;
    window.open(waLink(text), "_blank");
  });
  const groupCopyBtn = document.getElementById("group-copy-btn");
  if (groupCopyBtn) groupCopyBtn.addEventListener("click", () => copyText(document.getElementById("group-msg").value));

  document.querySelectorAll("[data-period]").forEach(el => el.addEventListener("click", () => {
    screen.statPeriod = Number(el.getAttribute("data-period"));
    render();
  }));
  const statsSelect = document.getElementById("stats-student-select");
  if (statsSelect) statsSelect.addEventListener("change", () => { screen.statStudent = statsSelect.value; render(); });
}

const SPLASH_START = Date.now();
const SPLASH_MIN_MS = 900;
const splashImg = document.getElementById("splash-logo");
if (splashImg && window.__LOGO_WHITE__) splashImg.src = window.__LOGO_WHITE__;

// Ana portaldaki "Site Tasarımı" sayfasından değiştirilen ad/logo/ana renk
// burada da (herkes için, tek seferde) uygulansın diye — anon key ile
// sadece OKUMA yapılabiliyor (bkz. supabase_schema_v15_site_tasarim.sql).
// Ağ isteği başarısız olursa ya da satır yoksa sessizce varsayılanlarla
// devam eder, uygulamanın kendisini asla bloklamaz.
(async function siteAyarlariniUygula() {
  try {
    if (!CONFIGURED) return;
    const { data } = await sb.from("site_ayarlari").select("*").eq("site", "kitap_takip").maybeSingle();
    if (!data) return;
    if (data.logo_url && splashImg) splashImg.src = data.logo_url;
    if (data.site_adi) {
      document.title = data.site_adi;
      if (splashImg) splashImg.alt = data.site_adi;
    }
    if (data.ana_renk) {
      document.documentElement.style.setProperty("--brand-navy", data.ana_renk);
      const geriBtn = document.getElementById("portal-geri-btn");
      if (geriBtn) geriBtn.style.background = data.ana_renk;
    }
  } catch (e) {
    // sessiz geç — Kitap Takip'in kendisi bundan etkilenmesin
  }
})();

load();
</script>
</body>
</html>
